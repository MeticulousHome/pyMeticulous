name: Build

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync

    - name: Lint with flake8
      run: uv run flake8 meticulous examples tests

    - name: Check code formatting with black
      run: uv run black --check meticulous examples tests

    - name: Run unit tests
      run: uv run pytest
